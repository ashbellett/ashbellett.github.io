title: Ash Bellett
description: "Data scientist analysing, building and optimising data-driven platforms and products."
lang: en-AU
author:
  name: Ash Bellett
include: [_pages]
exclude: [README.md, LICENSE, package.json, package-lock.json]
collections_dir: _posts
baseurl: ""
url: "https://ashbellett.com"
collections:
  sets:
    key: 0
    title: "Sets"
    description: "Collections of objects"
    output: true
    permalink: /notes/:collection/:path
    order:
      - logic.md
      - sets.md
      - functions.md
  linear-algebra:
    key: 1
    title: "Linear Algebra"
    description: "Representations of linear systems"
    output: true
    permalink: /notes/:collection/:path
    order:
      - vector-spaces.md
      - inner-product-spaces.md
      - linear-transformations.md
      - matrices.md
      - determinants.md
      - eigenvalues-eigenvectors.md
      - matrix-decompositions.md
  real-analysis:
    key: 2
    title: "Real Analysis"
    description: "Real-valued numbers and functions"
    output: true
    permalink: /notes/:collection/:path
    order:
      - real-numbers.md
      - sequences.md
      - limits.md
      - series.md
      - continuity.md
      - derivatives.md
      - integrals.md
      - vector-calculus.md
  topology:
    key: 3
    title: "Topology"
    description: "Nearness, limits and continuity in general spaces"
    output: true
    permalink: /notes/:collection/:path
    order:
      - metric-spaces.md
      - completeness.md
      - topological-spaces.md
      - compactness.md
      - connectedness.md
      - function-spaces.md
  differential-equations:
    key: 4
    title: "Differential Equations"
    description: "Equations relating functions to their derivatives"
    output: true
    permalink: /notes/:collection/:path
    order:
      - ordinary-differential-equations.md
      - first-order-equations.md
      - second-order-linear-equations.md
      - systems-of-equations.md
      - series-and-transform-methods.md
      - partial-differential-equations.md
      - boundary-value-problems.md
  optimisation:
    key: 5
    title: "Optimisation"
    description: "Maximising and minimising functions"
    output: true
    permalink: /notes/:collection/:path
    order:
      - convexity.md
      - unconstrained-optimisation.md
      - constrained-optimisation.md
  probability:
    key: 6
    title: "Probability"
    description: "Occurrences of uncertain events"
    output: true
    permalink: /notes/:collection/:path
    order:
      - events.md
      - probability-spaces.md
      - conditional-probability.md
      - random-variables.md
      - moments.md
      - distributions.md
      - concentration-bounds.md
      - probabilistic-convergence.md
      - limit-theorems.md
      - stochastic-processes.md
  frequentist-statistics:
    key: 7
    title: "Frequentist Statistics"
    description: "Drawing conclusions from data"
    output: true
    permalink: /notes/:collection/:path
    order:
      - samples.md
      - sufficiency.md
      - estimators.md
      - point-estimation.md
      - interval-estimation.md
      - hypothesis-testing.md
  bayesian-statistics:
    key: 8
    title: "Bayesian Statistics"
    description: "Modelling parameters as random variables"
    output: true
    permalink: /notes/:collection/:path
    order:
      - bayesian-inference.md
      - priors.md
      - posterior-summaries.md
      - computational-inference.md
      - model-choice.md
socials:
  - {
    platform: github,
    username: ashbellett,
    url: github.com/ashbellett
  }
  - {
    platform: linkedin,
    username: ashbellett,
    url: linkedin.com/in/ashbellett
  }
  - {
    platform: x,
    username: ashbellett,
    url: x.com/ashbellett
  }
analytics: aab2f9bb943f41cf8cac7e2dd7a08c59
kramdown:
  math_engine: katex
sass:
  style: compressed
  sourcemap: never
redirect_from:
  json: false
# Link previews: the profile photo is square, so use the small card.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/ash.jpg
        width: 400
        height: 400
        alt: Ash Bellett
twitter:
  card: summary
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
