analytics: aab2f9bb943f41cf8cac7e2dd7a08c59
# PostHog Cloud (US) project, used without cookies. The token is public: it
# is in every page. The hosts are also allowed by the Content Security Policy
# in _includes/head.html.
posthog:
  token: phc_n3KoMAj6eV4agmoHnF7bwsL9Zk5ZkjyovsgWt4CLzKzd
  api_host: https://us.i.posthog.com
  assets_host: https://us-assets.i.posthog.com
kramdown:
  math_engine: katex
sass:
  style: compressed
  sourcemap: never
redirect_from:
  json: false
# Link previews: the profile photo is square, so use the small card.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/ash.jpg
        width: 400
        height: 400
        alt: Ash Bellett
  # Every note in a topic folder. Each topic's index.md sets its own layout.
  # The glob matters: Jekyll matches collection documents by their path inside
  # collections_dir, and a plain "_posts" scope matches none of them.
  - scope:
      path: "_posts/_*"
    values:
      layout: post
twitter:
  card: summary
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
