<header class="site-header">

    <div class="wrapper">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

      {%- if site.data.navigation -%}
        <nav class="site-nav">
          {%- include nav-links.html -%}
        </nav>
      {%- endif -%}

      <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
        {%- include icons/moon.svg -%}
        {%- include icons/sun.svg -%}
      </button>

      {%- if site.data.navigation -%}
        <button class="menu-button" type="button" aria-label="Menu" aria-haspopup="dialog" aria-controls="menu" aria-expanded="false">
          {%- include icons/menu.svg -%}
        </button>

        <dialog class="menu" id="menu" aria-label="Menu">
          <div class="menu-panel">
            <button class="menu-close" type="button" aria-label="Close menu">
              {%- include icons/close.svg -%}
            </button>
            <nav>
              {%- include nav-links.html -%}
            </nav>
          </div>
        </dialog>
      {%- endif -%}
    </div>
  </header>
