{%- comment -%}
The search palette, opened by the header's search button or with / or
Ctrl+K (⌘K on a Mac). assets/js/search.js fills in the results; the input is
a combobox that keeps focus while the arrow keys move through them.
{%- endcomment -%}
<dialog class="search" id="search" aria-label="Search notes">
  <div class="search-field">
    {%- include icons/search.svg -%}
    <input class="search-input" type="search" placeholder="Search notes…" aria-label="Search notes" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" autocomplete="off" spellcheck="false" enterkeyhint="go">
    <button class="search-close" type="button" aria-label="Close search" title="Close (Esc)">
      {%- include icons/close.svg -%}
    </button>
  </div>
  <ul class="search-results" id="search-results" role="listbox" aria-label="Results"></ul>
  <p class="search-status" role="status"></p>
</dialog>
